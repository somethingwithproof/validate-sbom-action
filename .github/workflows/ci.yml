name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: test/valid-cyclonedx-1.4.json
            expect: valid
          - file: test/valid-cyclonedx-1.5.json
            expect: valid
          - file: test/valid-cyclonedx-1.6.json
            expect: valid
          - file: test/valid-cyclonedx-1.7.json
            expect: valid
          - file: test/valid-spdx-2.2.json
            expect: valid
          - file: test/valid-spdx-2.3.json
            expect: valid
          - file: test/invalid-missing-required-fields.json
            expect: invalid
          - file: test/invalid-bad-version.json
            expect: invalid
          - file: test/invalid-spdx-no-name.json
            expect: invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: ./
        id: validate
        with:
          input-file: ${{ matrix.file }}
        continue-on-error: true
      - name: Assert expected outcome
        shell: bash
        env:
          EXPECT: ${{ matrix.expect }}
          FILE: ${{ matrix.file }}
          GOT: ${{ steps.validate.outputs.valid }}
        run: |
          set -euo pipefail
          if [[ "$EXPECT" == "valid" ]]; then
            if [[ "$GOT" != "true" ]]; then
              echo "::error::Expected valid but got: $GOT"
              exit 1
            fi
          else
            if [[ "$GOT" != "false" ]]; then
              echo "::error::Expected invalid but got: $GOT"
              exit 1
            fi
          fi
          echo "Assertion passed: $FILE is $EXPECT"

  lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Bash syntax check
        run: bash -n scripts/validate.sh && bash -n scripts/update-schemas.sh
